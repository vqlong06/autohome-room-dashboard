name: LongOS Production Smoke

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longos-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Pages and cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Smoke test production
        run: >-
          node tools/test-pages-smoke.mjs
          --url "https://vqlong06.github.io/autohome-room-dashboard/"
          --expected-build live
          --require-cloud
