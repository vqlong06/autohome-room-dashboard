name: LongOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and release tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check Node.js scripts
        run: |
          node --check tools/embed-web.mjs
          node --check tools/lib/cloud-health.mjs
          node --check tools/lib/device-soak.mjs
          node --check tools/lib/nvs-retention.mjs
          node --check tools/lib/pages-release.mjs
          node --check tools/device-soak.mjs
          node --check tools/nvs-retention.mjs
          node --check tools/stage-pages-release.mjs
          node --check tools/test-brand-migration.mjs
          node --check tools/test-cloud-health.mjs
          node --check tools/test-device-soak.mjs
          node --check tools/test-device-smoke.mjs
          node --check tools/test-firmware-reliability.mjs
          node --check tools/test-health-web.mjs
          node --check tools/test-nvs-retention.mjs
          node --check tools/test-pages-smoke.mjs
          node --check tools/test-pages-smoke-integration.mjs
          node --check tools/test-pages-release.mjs
          node --check tools/test-release-pipeline.mjs
          node --check tools/test-supabase-migrations.mjs
          node --check tools/test-supabase-security.mjs

      - name: Run repository tests
        run: |
          node tools/test-brand-migration.mjs
          node tools/test-cloud-health.mjs
          node tools/test-device-soak.mjs
          node tools/test-firmware-reliability.mjs
          node tools/test-health-web.mjs
          node tools/test-nvs-retention.mjs
          node tools/test-pages-release.mjs
          node tools/test-release-pipeline.mjs
          node tools/device-soak.mjs --help
          node tools/nvs-retention.mjs --help
          node tools/test-device-smoke.mjs --help
          node tools/test-pages-smoke.mjs --help
          node tools/test-pages-smoke-integration.mjs
          node tools/stage-pages-release.mjs --help
          npm run test:supabase-semantic
          node tools/test-supabase-security.mjs

      - name: Test firmware retry policy
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -pedantic -Iinclude tools/test-firmware-retry-policy.cpp -o "${RUNNER_TEMP}/longos-firmware-retry-policy-test"
          "${RUNNER_TEMP}/longos-firmware-retry-policy-test"

  firmware:
    name: ESP32 firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-python-3.11-platformio-6.1.19-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: python -m pip install --disable-pip-version-check platformio==6.1.19

      - name: Create CI-only firmware configuration
        run: |
          test ! -e include/secrets.h
          install -m 600 include/secrets.example.h include/secrets.h

      - name: Build ESP32 firmware
        run: pio run -e esp32dev

      - name: Verify tracked files remain clean
        run: git diff --exit-code
